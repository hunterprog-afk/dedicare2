    <!-- Google tag (gtag.js) — deferred to after LCP / first interaction -->

      (function loadGtagDeferred() {
        var GA_ID = 'G-5FW1CTQ06Y';
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }
        // Load after window.load via idle callback, with a 4s safety fallback,
        // OR earlier on the first user interaction (whichever comes first).
        function schedule() {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadGtag, { timeout: 4000 });
          } else {
            setTimeout(loadGtag, 2500);
          }
        }
        if (document.readyState === 'complete') {
          schedule();
        } else {
          window.addEventListener('load', schedule, { once: true });
        }
        ['pointerdown','keydown','touchstart','scroll'].forEach(function(evt){
          window.addEventListener(evt, loadGtag, { once: true, passive: true });
        });
      })();
